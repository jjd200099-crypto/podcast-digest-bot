name: Handle Feishu podcast request

on:
  workflow_dispatch:
    inputs:
      message_id:
        description: "Feishu message ID used for reply and idempotency"
        required: true
        type: string
      request_text:
        description: "User message text"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: feishu-request-${{ inputs.message_id }}
  cancel-in-progress: true

jobs:
  handle-request:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch transcript, summarize, and reply
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5-mini' }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_INTERACTIVE_APP_ID || secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_INTERACTIVE_APP_SECRET || secrets.FEISHU_APP_SECRET }}
          FEISHU_MESSAGE_ID: ${{ inputs.message_id }}
          FEISHU_REQUEST_TEXT: ${{ inputs.request_text }}
        run: python src/handle_request.py
