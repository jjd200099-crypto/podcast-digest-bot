name: One-time encrypted OpenAI secret handoff

on:
  push:
    branches:
      - codex/news-officer-service

permissions:
  contents: read

jobs:
  encrypt:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt repository secret for the one-time Railway bootstrap
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_API_KEY"
          cat > recipient.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAzJbZb78oYBbQHexUUwki
          vAyBcwIjAj3KwOUihXZzTiWHDlUDhTfV/Jb0t7dcD/L7O03CkTa/gBUNG6hWlEc9
          2y7t7sWiJyq9YyFQzvl3yhbSuTpPTBWNuzGvsYvv9s+uGaLe7OCLlPEotNpMFtNY
          jZzo8b3ZBFRgkLbDswkUF1V7EdYjJ6RXF514L6IdcsUUDWu9jV4BXeaPdFUwwKya
          6erw9lXy6MGdmfI+LMMqWB1Opp5TSRZHGgskBPlZFX5py9MK2YY8S9U+8iLf6mKB
          xAAQDLNrTXbcTX4ZAnotItF44MCzImSihh7uJpL/Loo5i5NaJf+eN8fhQxxQMcOQ
          HH6VsbWqMPXXbRQC94xU0Idz0DRIQTMArj7haLtm1kIg7rf51VwlouZjJ/NS8ClF
          sYvVvC9nx1H0XmR2iJK6J5ByEHfuCaMJGun/uyaj2xYVwU9yS2sAuU8Mi6X5u7lq
          0p0dHey/CptY7erDhVciogk1jpILzivXp++9mR6hEYyFAgMBAAE=
          -----END PUBLIC KEY-----
          PUBLIC_KEY
          printf '%s' "$OPENAI_API_KEY" | openssl pkeyutl -encrypt \
            -pubin -inkey recipient.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -out openai-key.enc
          unset OPENAI_API_KEY
          rm recipient.pem

      - uses: actions/upload-artifact@v4
        with:
          name: news-officer-openai-key
          path: openai-key.enc
          retention-days: 1
          if-no-files-found: error
