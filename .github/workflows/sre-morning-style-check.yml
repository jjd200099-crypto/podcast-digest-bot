name: SRE Morning Style Check

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'YYYY-MM-DD Asia/Shanghai'
        required: true
        type: string

permissions:
  contents: read

jobs:
  style:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'requests>=2.32.3,<3'
      - name: Style-check Feishu daily
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          NEWS_OFFICER_WATCH_CHAT_ID: ${{ vars.NEWS_OFFICER_WATCH_CHAT_ID }}
          WATCH_DATE: ${{ inputs.date }}
        run: python3 .github/scripts/sre_morning_style_check.py
