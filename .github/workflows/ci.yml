name: Test news officer

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'codex/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip install ruff
      - run: ruff check src tests scripts
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src tests scripts

  hermes-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/install_hermes_pilot.py "${{ runner.temp }}/hermes-pilot"
      - run: python -m unittest discover -s tests -p test_hermes_runtime.py -v
        env:
          PYTHONPATH: src
          TEST_HERMES_PYTHON: ${{ runner.temp }}/hermes-pilot/venv/bin/python
